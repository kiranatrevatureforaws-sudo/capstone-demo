name: ShopSphere CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Project Structure
        run: |
          echo "ShopSphere CI pipeline started"
          test -f .gitignore
          test -d .github/workflows
          echo "Repository structure validated successfully"

      - name: Show Java Version
        run: java -version

      - name: Complete Validation
        run: echo "ShopSphere CI pipeline completed successfully"